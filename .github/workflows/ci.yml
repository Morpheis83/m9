name: CI MLOps

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # ==========================================================
  # TESTS + QUALITE
  # ==========================================================

  quality:

    name: Tests et lint

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

          cache: pip

          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt


      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff


      - name: Vérification syntaxique Ruff
        run: |
          ruff check src tests \
            --select E9,F63,F7,F82 \
            --output-format=github


      - name: Tests Pytest
        run: |
          python -m pytest -v


  # ==========================================================
  # DOCKER + SMOKE TEST
  # ==========================================================

  docker-smoke:

    name: Build Docker et smoke test

    needs:
      - quality

    runs-on: ubuntu-latest

    timeout-minutes: 45

    env:
      ADMIN_TOKEN: ci-admin-token


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Vérifier Docker
        run: |
          docker version
          docker compose version


      - name: Valider Docker Compose
        run: |
          docker compose config --quiet


      - name: Construire les images
        run: |
          docker compose build


      - name: Rendre le smoke test exécutable
        run: |
          chmod +x tests/smoke_test.sh


      - name: Smoke test
        run: |
          ./tests/smoke_test.sh


      - name: Logs Docker en cas d'échec
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs \
            --no-color \
            --tail=200 \
            || true


      - name: Nettoyage
        if: always()
        run: |
          docker compose down \
            -v \
            --remove-orphans \
            || true